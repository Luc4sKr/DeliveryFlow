
services:
  delivery-service:
    build:
      context: ./DeliveryService
      dockerfile: Dockerfile
    environment:
      RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
          condition: service_healthy

  validation-service:
    build:
      context: ./ValidationService
      dockerfile: Dockerfile
    environment:
      RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
          condition: service_healthy

  geocoding-service:
    build:
      context: ./GeocodingService
      dockerfile: Dockerfile
    environment:
      RABBIT_MQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
          condition: service_healthy

  priority-service:
    build:
      context: ./PriorityService
      dockerfile: Dockerfile
    environment:
      RABBIT_MQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
          condition: service_healthy

  regionalization-service:
    build:
      context: ./RegionalizationService
      dockerfile: Dockerfile
    environment:
      RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
          condition: service_healthy

  routing-service:
    build:
      context: ./RoutingService
      dockerfile: Dockerfile
    environment:
      RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
          condition: service_healthy

  warehouse-service:
    build:
      context: ./WarehouseService
      dockerfile: Dockerfile
    environment:
      RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
          condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
